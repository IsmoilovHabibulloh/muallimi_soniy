<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' font-family='-apple-system,system-ui' font-weight='700' fill='%23f5f5f7'%3EY%3C/text%3E%3C/svg%3E" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  *::selection { background: rgba(255,255,255, 0.18); }

  :root {
    --bg: #0a0a0c;
    --fg: #f5f5f7;
    --fg-muted: rgba(245, 245, 247, 0.58);
    --fg-dim: rgba(245, 245, 247, 0.28);
    --glass-bg: rgba(255, 255, 255, 0.055);
    --glass-bg-hover: rgba(255, 255, 255, 0.09);
    --glass-border: rgba(255, 255, 255, 0.11);
    --glass-border-hover: rgba(255, 255, 255, 0.18);
  }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ─── Background blobs (Liquid Glass ambience) ─── */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: float 22s ease-in-out infinite;
    will-change: transform;
  }
  .blob-1 {
    width: 460px; height: 460px;
    background: radial-gradient(circle, #c87936 0%, transparent 70%);
    top: -140px; left: -120px;
  }
  .blob-2 {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #3a4d6b 0%, transparent 70%);
    bottom: -180px; right: -160px;
    animation-delay: -11s;
  }
  .blob-3 {
    width: 340px; height: 340px;
    background: radial-gradient(circle, #6b3a5c 0%, transparent 70%);
    top: 38%; left: 28%;
    opacity: 0.32;
    animation-delay: -6s;
  }
  /* Subtle grain for cinematic feel */
  .bg-grain {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.04;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.06); }
    66% { transform: translate(-30px, 40px) scale(0.94); }
  }

  /* ─── Layout ─── */
  .container {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ─── Avatar ─── */
  .avatar-wrap {
    position: relative;
    margin-bottom: 26px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -28px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,121,54, 0.28), transparent 65%);
    z-index: -1;
    filter: blur(8px);
  }
  .avatar {
    position: relative;
    width: 140px; height: 140px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(145deg, #2a2a2e, #141416);
    border: 1px solid rgba(255,255,255, 0.14);
    box-shadow:
      0 20px 60px rgba(0,0,0, 0.55),
      0 1px 0 rgba(255,255,255, 0.12) inset,
      0 -10px 30px rgba(0,0,0, 0.4) inset;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-fallback {
    font-size: 56px;
    font-weight: 300;
    color: rgba(255,255,255, 0.35);
    letter-spacing: -0.02em;
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 25%;
  }

  /* ─── Specialty pills ─── */
  .specialties {
    display: flex;
    gap: 7px;
    margin-bottom: 14px;
  }
  .spec-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 500;
    color: var(--fg-muted);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 1px 0 rgba(255,255,255, 0.08) inset;
    letter-spacing: 0.01em;
  }
  .spec-pill svg {
    width: 11px; height: 11px;
  }

  /* ─── Title ─── */
  .name {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-bottom: 6px;
    text-align: center;
  }
  .role {
    font-size: 14px;
    color: var(--fg-muted);
    margin-bottom: 36px;
    text-align: center;
    letter-spacing: 0.005em;
  }

  /* ─── Link cards ─── */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    text-decoration: none;
    color: var(--fg);
    transition:
      transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
      background 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255, 0.13) inset,
      0 -1px 0 rgba(0,0,0, 0.20) inset,
      0 6px 22px rgba(0,0,0, 0.22);
    -webkit-tap-highlight-color: transparent;
  }
  /* Specular top sheen */
  .link-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,0.10) 0%, transparent 45%);
    pointer-events: none;
  }
  .link-card:hover,
  .link-card:focus-visible {
    background: var(--glass-bg-hover);
    border-color: var(--glass-border-hover);
    transform: translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255,255,255, 0.18) inset,
      0 -1px 0 rgba(0,0,0, 0.22) inset,
      0 12px 32px rgba(0,0,0, 0.30);
  }
  .link-card:active {
    transform: translateY(0) scale(0.985);
    transition-duration: 0.12s;
  }
  .link-card:focus-visible {
    outline: 2px solid rgba(255,255,255, 0.4);
    outline-offset: 2px;
  }

  .link-icon {
    width: 44px; height: 44px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--brand);
    color: white;
    box-shadow:
      0 6px 16px var(--brand-shadow),
      0 1px 0 rgba(255,255,255, 0.25) inset;
  }
  .link-icon svg {
    width: 22px; height: 22px;
    fill: currentColor;
  }

  .link-body {
    flex: 1;
    min-width: 0;
  }
  .link-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .link-handle {
    font-size: 12.5px;
    color: var(--fg-muted);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }

  .link-arrow {
    width: 18px; height: 18px;
    color: var(--fg-dim);
    flex-shrink: 0;
    transition: transform 0.3s ease, color 0.25s ease;
  }
  .link-card:hover .link-arrow,
  .link-card:focus-visible .link-arrow {
    transform: translateX(3px);
    color: var(--fg);
  }

  /* Brand colors */
  .link-card.behance {
    --brand: linear-gradient(135deg, #1769ff, #052bff);
    --brand-shadow: rgba(23, 105, 255, 0.42);
  }
  .link-card.instagram {
    --brand: linear-gradient(135deg, #f09433, #e6683c 30%, #dc2743 55%, #cc2366 75%, #bc1888);
    --brand-shadow: rgba(220, 39, 67, 0.42);
  }
  .link-card.telegram {
    --brand: linear-gradient(135deg, #37aee2, #1e96c8);
    --brand-shadow: rgba(55, 174, 226, 0.42);
  }

  /* ─── Footer ─── */
  .footer {
    margin-top: auto;
    padding-top: 48px;
    font-size: 11px;
    color: var(--fg-dim);
    text-align: center;
    letter-spacing: 0.02em;
  }
  .footer .dot {
    display: inline-block;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--fg-dim);
    vertical-align: middle;
    margin: 0 6px 2px;
  }

  /* Reveal animation */
  .reveal {
    opacity: 0;
    transform: translateY(8px);
    animation: reveal 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .reveal:nth-child(1) { animation-delay: 0.05s; }
  .reveal:nth-child(2) { animation-delay: 0.12s; }
  .reveal:nth-child(3) { animation-delay: 0.19s; }
  .reveal:nth-child(4) { animation-delay: 0.26s; }
  .reveal:nth-child(5) { animation-delay: 0.33s; }
  .reveal:nth-child(6) { animation-delay: 0.40s; }
  .reveal:nth-child(7) { animation-delay: 0.47s; }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Small screens */
  @media (max-width: 380px) {
    .container { padding: 44px 18px 28px; }
    .avatar { width: 124px; height: 124px; }
    .avatar-fallback { font-size: 50px; }
    .name { font-size: 26px; }
    .link-card { padding: 12px 14px; border-radius: 18px; }
    .link-icon { width: 40px; height: 40px; border-radius: 12px; }
    .link-icon svg { width: 20px; height: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
    .reveal { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
